name: "缺陷报告（简体中文）"
description: 包含环境和行为细节的可复现缺陷。
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Issue 与对应实现 PR 使用完全相同的标题，格式为 `type: 具体内容`。类别包括 feat、fix、refactor、perf、test、docs、build、ci 和 chore，类别与最终范围一致。
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与预期行为
      description: 实际结果和预期结果描述行为差异。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 代码、命令、场景设置和输入用于复现行为。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 提交或版本、操作系统、编译器、构建配置和相关硬件标识环境。
    validations:
      required: true
  - type: textarea
    id: numerical_settings
    attributes:
      label: 仿真设置
      description: 步长、子步、精度、迭代次数和随机种子描述物理问题的运行条件。
  - type: textarea
    id: evidence
    attributes:
      label: 证据与影响
      description: 日志、测量、图片和受影响场景说明问题影响。

name: "Bug report (English)"
description: A reproducible defect with environment and behavior details.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        The issue and its implementation PR share the exact title `type: description`. Categories are feat, fix, refactor, perf, test, docs, build, ci and chore. The category reflects the final scope.
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: The observed result and expected result define the discrepancy.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code, commands, scene settings, and inputs reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: The commit or release, operating system, compiler, build configuration, and relevant hardware identify the environment.
    validations:
      required: true
  - type: textarea
    id: numerical_settings
    attributes:
      label: Simulation settings
      description: Timestep, substeps, precision, iterations, and random seed characterize physics-related reports.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Logs, measurements, images, and affected scenarios describe the impact.

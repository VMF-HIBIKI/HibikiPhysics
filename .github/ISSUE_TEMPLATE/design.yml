name: "Design investigation (English)"
description: A time-bounded investigation supporting an engineering decision.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        The issue and its implementation PR share the exact title `type: description`. Categories are feat, fix, refactor, perf, test, docs, build, ci and chore. The category reflects the final scope.
  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: The problem, constraints, and affected interfaces establish the decision context.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Candidate approaches
      description: Candidate approaches include their expected benefits, costs, and uncertainties.
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: Investigation and time budget
      description: The experiment plan and time budget bound the investigation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Decision criteria and deliverable
      description: Evaluation criteria and a report or ADR define completion.
    validations:
      required: true
